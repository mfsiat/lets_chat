name: Node runtime validation

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    name: Node 26 client build and server smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install client dependencies
        working-directory: client
        run: npm install --no-package-lock --no-audit --no-fund --legacy-peer-deps

      - name: Build client
        working-directory: client
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: npm run build

      - name: Install server dependencies
        working-directory: server
        run: npm install --no-package-lock --no-audit --no-fund --legacy-peer-deps

      - name: Test server startup and health route
        working-directory: server
        run: npm test
